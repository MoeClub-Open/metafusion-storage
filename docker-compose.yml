version: '3.8'

# 存储服务独立编排：只依赖 PostgreSQL（自有 storage schema）与对象存储。
# 使用本域独立数据库身份；数据库实例可以与其他服务共用。
services:
  storage:
    build: .
    container_name: metafusion-storage
    restart: unless-stopped
    environment:
      - PORT=8082
      - DATABASE_URL=${STORAGE_DATABASE_URL:?STORAGE_DATABASE_URL must be set in .env}
      - STORAGE_ROOT=/app/storage-data
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
      - STORAGE_S3_PUBLIC_ENDPOINT=${STORAGE_S3_PUBLIC_ENDPOINT:-}
      - STORAGE_S3_ACCESS_KEY=${MINIO_ROOT_USER:-}
      - STORAGE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-metafusion-master}
      - STORAGE_S3_TLS=${STORAGE_S3_TLS:-false}
      # 账号服务是唯一签发方：JWKS 与不透明会话令牌的兜底都问它（与主工程编排一致）。
      - STORAGE_JWKS_URL=${STORAGE_JWKS_URL:-http://auth:8081/api/oidc/jwks}
      - AUTH_URL=${AUTH_URL:-http://auth:8081}
      # 目录服务在主工程编排里叫 backend（没有叫 catalog 的服务）。
      - CATALOG_URL=${CATALOG_URL:-http://backend:8080}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    volumes:
      - storage_data:/app/storage-data
    ports:
      - "8082:8082"
    networks:
      - metafusion-net

networks:
  metafusion-net:
    external: true

volumes:
  storage_data:
