name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：只有 checkout 需要读权限
permissions:
  contents: read

jobs:
  go:
    name: go (build / vet / test)
    runs-on: ubuntu-latest
    # store 的回归用例需要真实 PostgreSQL（未设置 STORAGE_TEST_DSN 时它们自己 t.Skip）。
    # 这里起临时库把回归也跑起来，等价于本地：
    #   STORAGE_TEST_DSN='postgres://postgres:****@127.0.0.1:5432/metafusion_storage_test?sslmode=disable' go test ./...
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: metafusion_storage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 库名必须含 _test：testutil.DSN 会拒绝非独立测试库
      # testutil 只校验 DSN 非空且库名含 _test；lib/pq 默认要 TLS，故显式 sslmode=disable
      STORAGE_TEST_DSN: postgres://postgres:test-only-password@127.0.0.1:5432/metafusion_storage_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1：handler 与 store 两个共用同一个测试库，store 包的清理会删掉 handler 包的资产，
        # 并行跑会偶发失败（在 HEAD 上可复现，不是某一批改动引入的）。
        run: go test -p 1 ./...

  admin:
    name: admin (typecheck / i18n / build)
    runs-on: ubuntu-latest
    # 管理台是与 Go 服务并列的独立应用（解耦审计 §7.3「每服务自带 UI」）：
    # 它只依赖 /api/storage 的 HTTP 契约，因此这一步不启动任何后端，CI 里跑的是构建期能发现的问题。
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: 管理工作区协议测试
        run: bun run test
      - name: typecheck
        run: bun run typecheck
      - name: i18n 四语键一致性
        run: bun run i18n:check
      - name: next build
        run: bun run build
